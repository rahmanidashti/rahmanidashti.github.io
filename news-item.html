<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .prose { font-size: 1rem; line-height: 1.8; font-weight: 300; color: #1A2E21; }
  .prose h3 { font-family: Fraunces, serif; font-size: 1.35rem; font-weight: 400; color: #1B4332; margin: 36px 0 12px; }
  .prose h4 { font-size: 1rem; font-weight: 600; color: #1B4332; margin: 28px 0 10px; }
  .prose p { margin: 0 0 18px; }
  .prose ul, .prose ol { margin: 0 0 20px; padding-left: 22px; }
  .prose li { margin-bottom: 8px; }
  .prose figure { margin: 28px 0; }
  .prose img { width: 100%; display: block; border: 1px solid #D0E8D8; border-radius: 14px; }
</style>
</helmet>
<div style="min-height:100vh; background:#F8FAF8; color:#1A2E21; font-family:Inter,-apple-system,sans-serif; line-height:1.6;">
  <div style="max-width:760px; margin:0 auto; padding:32px 28px 40px;">
    <dc-import name="SiteNav" active="news" hint-size="100%,64px"></dc-import>

    <a href="news.html" style="display:inline-block; font-size:0.8125rem; color:#4E7260; text-decoration:none; margin-bottom:24px;" style-hover="color:#1B4332;"><span style="display:inline-flex; align-items:center; gap:6px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg><span>All news</span></span></a>

    <div style="font-size:0.75rem; font-weight:700; color:#8CA898; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:10px;">{{ date }}</div>
    <h1 style="font-family:Fraunces,serif; font-size:clamp(1.7rem,3.4vw,2.3rem); font-weight:400; color:#1B4332; letter-spacing:-0.02em; line-height:1.25; margin:0 0 32px;">{{ title }}</h1>

    <div class="prose">{{ body }}</div>

    <dc-import name="SiteFooter" hint-size="100%,160px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { item: null, html: '' };

  async componentDidMount() {
    const S = await import('./js/site.js');
    this.S = S;
    const news = await S.loadJSON('news');
    const id = S.queryParam('id');
    const item = news.find(n => n.id === id) || news.find(n => n.hasPage);
    if (!item) return;
    document.title = (item.title || 'News') + ' — Hossein A. Rahmani';
    let html = '';
    try {
      const r = await fetch('content/news/' + item.id + '.html');
      if (r.ok) html = await r.text();
    } catch (e) { html = ''; }
    this.setState({ item, html });
  }

  renderVals() {
    const { item, html } = this.state;
    if (!item) return { title: 'Loading…', date: '', body: null };
    return {
      title: item.title || 'News',
      date: this.S.longDate(item.date),
      body: React.createElement('div', { dangerouslySetInnerHTML: { __html: html } })
    };
  }
}
</script>
</body>
</html>
