<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-height:100vh; background:#F8FAF8; color:#1A2E21; font-family:Inter,-apple-system,sans-serif; line-height:1.6;">
  <div style="max-width:860px; margin:0 auto; padding:32px 28px 40px;">
    <dc-import name="SiteNav" active="blog" hint-size="100%,64px"></dc-import>

    <div style="font-size:0.7rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:#52B788; margin-bottom:10px;">Writing</div>
    <h1 style="font-family:Fraunces,serif; font-size:clamp(2rem,4vw,2.6rem); font-weight:300; font-style:italic; color:#1B4332; letter-spacing:-0.02em; margin:0 0 12px;">Blog</h1>
    <p style="font-size:0.95rem; color:#4E7260; font-weight:300; max-width:620px; margin:0 0 40px;">Notes on research, evaluation, and the occasional conference statistics report.</p>

    <div style="display:flex; flex-direction:column; gap:14px;">
      <sc-for list="{{ posts }}" as="p" hint-placeholder-count="2">
        <a href="{{ p.href }}" style="display:block; background:#FFFFFF; border:1px solid #D0E8D8; border-radius:14px; padding:24px 26px; text-decoration:none; color:inherit; transition:border-color .2s, box-shadow .2s;" style-hover="border-color:#B7E4C7; box-shadow:0 1px 8px rgba(27,67,50,0.07);">
          <div style="font-size:0.72rem; font-weight:700; color:#8CA898; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:8px;">{{ p.date }} &middot; {{ p.category }}</div>
          <div style="font-family:Fraunces,serif; font-size:1.3rem; font-weight:400; color:#1B4332; line-height:1.3; margin-bottom:8px;">{{ p.title }}</div>
          <p style="font-size:0.9rem; color:#4E7260; font-weight:300; margin:0 0 12px;">{{ p.description }}</p>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <sc-for list="{{ p.tags }}" as="t" hint-placeholder-count="3">
              <span style="font-size:0.68rem; font-weight:600; padding:2px 9px; border-radius:100px; background:#EDF5EF; color:#2D6A4F;">{{ t }}</span>
            </sc-for>
          </div>
        </a>
      </sc-for>
    </div>

    <dc-import name="SiteFooter" hint-size="100%,160px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { posts: null };

  async componentDidMount() {
    const S = await import('./js/site.js');
    this.S = S;
    this.setState({ posts: await S.loadJSON('posts') });
  }

  renderVals() {
    if (!this.state.posts) return { posts: [] };
    return {
      posts: this.state.posts.map(p => ({
        href: 'post.html?id=' + p.id,
        date: this.S.longDate(p.date),
        category: p.category,
        title: p.title,
        description: p.description,
        tags: p.tags
      }))
    };
  }
}
</script>
</body>
</html>
