<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-height:100vh; background:#F8FAF8; color:#1A2E21; font-family:Inter,-apple-system,sans-serif; line-height:1.6;">
  <div style="max-width:860px; margin:0 auto; padding:32px 28px 40px;">
    <dc-import name="SiteNav" active="news" hint-size="100%,64px"></dc-import>

    <div style="font-size:0.7rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:#52B788; margin-bottom:10px;">Updates</div>
    <h1 style="font-family:Fraunces,serif; font-size:clamp(2rem,4vw,2.6rem); font-weight:300; font-style:italic; color:#1B4332; letter-spacing:-0.02em; margin:0 0 40px;">News</h1>

    <sc-for list="{{ years }}" as="y" hint-placeholder-count="4">
      <section style="margin-bottom:44px;">
        <h2 style="font-family:Fraunces,serif; font-size:1.5rem; font-weight:400; color:#8CA898; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid #D0E8D8;">{{ y.year }}</h2>
        <div style="display:flex; flex-direction:column;">
          <sc-for list="{{ y.items }}" as="n" hint-placeholder-count="6">
            <div style="display:grid; grid-template-columns:74px 1fr; gap:0; padding:14px 0; border-bottom:1px solid #EDF5EF;">
              <div style="font-size:0.72rem; font-weight:700; color:#8CA898; letter-spacing:0.06em; text-transform:uppercase; text-align:right; padding-right:18px; padding-top:3px;">{{ n.date }}</div>
              <div>
                <div class="newsbody" style="font-size:0.95rem; line-height:1.65;">{{ n.node }}</div>
                <sc-if value="{{ n.hasPage }}" hint-placeholder-val="{{ false }}">
                  <a href="{{ n.href }}" style="display:inline-block; margin-top:6px; font-size:0.78rem; color:#2D6A4F; text-decoration:none; border-bottom:1px solid #B7E4C7;" style-hover="color:#1B4332;">Read the full story &rarr;</a>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <dc-import name="SiteFooter" hint-size="100%,160px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { news: null };

  async componentDidMount() {
    const S = await import('./js/site.js');
    this.S = S;
    this.setState({ news: await S.loadJSON('news') });
  }

  renderVals() {
    const news = this.state.news, S = this.S;
    if (!news) return { years: [] };
    const groups = [];
    news.forEach(n => {
      const y = n.date.slice(0, 4);
      let g = groups.find(x => x.year === y);
      if (!g) { g = { year: y, items: [] }; groups.push(g); }
      g.items.push({
        date: S.shortDate(n.date),
        node: React.createElement('span', { dangerouslySetInnerHTML: { __html: n.title ? '<strong>' + n.title + '</strong> ' + n.html : n.html } }),
        hasPage: !!n.hasPage,
        href: n.hasPage ? 'news-item.html?id=' + n.id : '#'
      });
    });
    return { years: groups };
  }
}
</script>
</body>
</html>
