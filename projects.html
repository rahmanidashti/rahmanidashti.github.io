<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-height:100vh; background:#F8FAF8; color:#1A2E21; font-family:Inter,-apple-system,sans-serif; line-height:1.6;">
  <div style="max-width:1000px; margin:0 auto; padding:32px 28px 40px;">
    <dc-import name="SiteNav" active="projects" hint-size="100%,64px"></dc-import>

    <div style="font-size:0.7rem; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:#52B788; margin-bottom:10px;">Work</div>
    <h1 style="font-family:Fraunces,serif; font-size:clamp(2rem,4vw,2.6rem); font-weight:300; font-style:italic; color:#1B4332; letter-spacing:-0.02em; margin:0 0 12px;">Projects</h1>
    <p style="font-size:0.95rem; color:#4E7260; font-weight:300; max-width:620px; margin:0 0 40px;">Workshops, benchmarks, resources and challenges I have built or helped organise.</p>

    <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:18px;">
      <sc-for list="{{ items }}" as="p" hint-placeholder-count="6">
        <div style="background:#FFFFFF; border:1px solid #D0E8D8; border-radius:14px; padding:26px 28px; transition:border-color .2s, box-shadow .2s, transform .2s;" style-hover="border-color:#B7E4C7; box-shadow:0 4px 24px rgba(27,67,50,0.11); transform:translateY(-3px);">
          <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px;">
            <span style="font-size:0.68rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#52B788;">{{ p.category }}</span>
            <span style="font-size:0.72rem; font-weight:600; color:#8CA898;">{{ p.years }}</span>
          </div>
          <h2 style="font-family:Fraunces,serif; font-size:1.25rem; font-weight:400; color:#1B4332; margin:0 0 10px;">{{ p.title }}</h2>
          <p style="font-size:0.875rem; color:#4E7260; font-weight:300; line-height:1.65; margin:0 0 16px;">{{ p.desc }}</p>
          <div style="display:flex; gap:7px; flex-wrap:wrap;">
            <sc-for list="{{ p.linkList }}" as="l" hint-placeholder-count="2">
              <a href="{{ l.url }}" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:5px; font-size:0.76rem; font-weight:500; padding:4px 12px; border-radius:100px; border:1px solid #D0E8D8; color:#4E7260; text-decoration:none; transition:all .2s;" style-hover="background:#1B4332; border-color:#1B4332; color:#FFFFFF;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><path d="{{ l.iconPath }}"></path></svg>
                <span>{{ l.label }}</span>
              </a>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <dc-import name="SiteFooter" hint-size="100%,160px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const LINK_LABELS = { paper: 'Paper', arxiv: 'arXiv', code: 'Code', website: 'Website' };
let ICONS = {}, LINK_ICONS = {};

class Component extends DCLogic {
  state = { items: null };
  async componentDidMount() {
    const [S, I] = await Promise.all([import('./js/site.js'), import('./js/icons.js')]);
    ICONS = I.ICONS; LINK_ICONS = I.LINK_ICONS;
    this.setState({ items: await S.loadJSON('projects') });
  }
  renderVals() {
    if (!this.state.items) return { items: [] };
    return {
      items: this.state.items.map(p => Object.assign({}, p, {
        linkList: Object.keys(p.links || {}).filter(k => p.links[k]).map(k => ({ label: LINK_LABELS[k] || k, url: p.links[k], iconPath: ICONS[LINK_ICONS[k]] || ICONS.website }))
      }))
    };
  }
}
</script>
</body>
</html>
