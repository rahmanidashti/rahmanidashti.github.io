<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .prose { font-size: 1.0125rem; line-height: 1.85; font-weight: 300; color: #1A2E21; }
  .prose h3 { font-family: Fraunces, serif; font-size: 1.4rem; font-weight: 400; color: #1B4332; margin: 40px 0 14px; line-height: 1.3; }
  .prose h4 { font-size: 1.02rem; font-weight: 600; color: #1B4332; margin: 32px 0 10px; }
  .prose p { margin: 0 0 20px; }
  .prose ul, .prose ol { margin: 0 0 22px; padding-left: 22px; }
  .prose li { margin-bottom: 9px; }
  .prose blockquote { margin: 0 0 22px; padding: 14px 20px; background: #EDF5EF; border-left: 3px solid #52B788; border-radius: 0 8px 8px 0; font-size: 0.95rem; color: #2D6A4F; }
  .prose code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.86em; background: #EDF5EF; padding: 1px 6px; border-radius: 5px; color: #1B4332; }
  .prose figure { margin: 30px 0; }
  .prose figcaption, .prose .caption { font-size: 0.82rem; color: #8CA898; text-align: center; margin-top: 10px; }
  .prose img { width: 100%; display: block; border: 1px solid #D0E8D8; border-radius: 14px; background: #FFFFFF; }
  .prose .figrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 30px 0 0; }
  .prose .figrow figure { margin: 0; }
</style>
</helmet>
<div style="min-height:100vh; background:#F8FAF8; color:#1A2E21; font-family:Inter,-apple-system,sans-serif; line-height:1.6;">
  <div style="max-width:760px; margin:0 auto; padding:32px 28px 40px;">
    <dc-import name="SiteNav" active="blog" hint-size="100%,64px"></dc-import>

    <a href="blog.html" style="display:inline-block; font-size:0.8125rem; color:#4E7260; text-decoration:none; margin-bottom:24px;" style-hover="color:#1B4332;"><span style="display:inline-flex; align-items:center; gap:6px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"></path></svg><span>All posts</span></span></a>

    <div style="font-size:0.72rem; font-weight:700; color:#8CA898; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:10px;">{{ meta }}</div>
    <h1 style="font-family:Fraunces,serif; font-size:clamp(1.8rem,3.6vw,2.4rem); font-weight:400; color:#1B4332; letter-spacing:-0.02em; line-height:1.22; margin:0 0 10px;">{{ title }}</h1>
    <p style="font-size:1rem; color:#4E7260; font-weight:300; margin:0 0 36px;">{{ description }}</p>

    <div class="prose">{{ body }}</div>

    <dc-import name="SiteFooter" hint-size="100%,160px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { post: null, html: '' };

  async componentDidMount() {
    const S = await import('./js/site.js');
    this.S = S;
    const posts = await S.loadJSON('posts');
    const id = S.queryParam('id');
    const post = posts.find(p => p.id === id) || posts[0];
    document.title = post.title + ' — Hossein A. Rahmani';
    let html = '';
    try {
      const r = await fetch('content/posts/' + post.id + '.html');
      if (r.ok) html = await r.text();
    } catch (e) { html = ''; }
    this.setState({ post, html });
  }

  renderVals() {
    const { post, html } = this.state;
    if (!post) return { title: 'Loading…', meta: '', description: '', body: null };
    return {
      title: post.title,
      meta: this.S.longDate(post.date) + ' · ' + post.category,
      description: post.description,
      body: React.createElement('div', { dangerouslySetInnerHTML: { __html: html } })
    };
  }
}
</script>
</body>
</html>
